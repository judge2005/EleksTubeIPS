<!-- An EleksTube clock: six tubes with glowing digits, lit from below by the LEDs in its base. favicon.png
     and apple-touch-icon.png are exported from it, for browsers that don't show SVG icons. -->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64">
<defs>
<linearGradient id="bg" x2="0" y2="1"><stop offset="0" stop-color="#010e54"/><stop offset="1" stop-color="#00022b"/></linearGradient>
<linearGradient id="tube" x2="0" y2="1"><stop offset=".55" stop-color="#05081a"/><stop offset="1" stop-color="#0e3a73"/></linearGradient>
<filter id="glow" x="-1" y="-1" width="3" height="3"><feGaussianBlur stdDeviation="1.1"/></filter>
</defs>
<rect width="64" height="64" rx="14" fill="url(#bg)"/>
